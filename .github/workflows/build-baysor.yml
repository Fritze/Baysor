name: Build Baysor Binary

on:
  workflow_dispatch:
  push:
    branches: [cpp]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        run: |
          git clone --depth 1 --branch cpp https://github.com/kharchenkolab/Baysor.git .

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates lsb-release wget
          wget https://packages.apache.org/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-$(lsb_release -cs).deb
          sudo apt-get install -y ./apache-arrow-apt-source-latest-$(lsb_release -cs).deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libeigen3-dev libomp-dev libspdlog-dev libcgal-dev \
            libarrow-dev libparquet-dev libhdf5-dev \
            nlohmann-json3-dev libtiff-dev \
            libspdlog-dev libfmt-dev \
            liblz4-dev libsnappy-dev libzstd-dev libbz2-dev \
            libssl-dev libcurl4-openssl-dev libre2-dev \
            libboost-dev libgmp-dev libmpfr-dev \
            libutf8proc-dev libthrift-dev

      - name: Build static
        run: |
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$PWD/install \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++" \
            -DCMAKE_FIND_LIBRARY_SUFFIXES=".a" \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build build --target baysor
          cmake --install build

      - name: Verify
        run: |
          file install/bin/baysor
          ldd install/bin/baysor || true

      - name: Bundle with shared libs
        run: |
          mkdir -p bundle/lib
          cp install/bin/baysor bundle/
          # Copy all shared library dependencies
          ldd install/bin/baysor | awk '/=>/ {print $3}' | while read lib; do
            [ -f "$lib" ] && cp "$lib" bundle/lib/
          done
          # Copy ld-linux
          cp /lib64/ld-linux-x86-64.so.2 bundle/lib/
          # Create wrapper script
          cat > bundle/run_baysor.sh << 'EOF'
#!/bin/bash
DIR="$(cd "$(dirname "$0")" && pwd)"
export LD_LIBRARY_PATH="$DIR/lib:$LD_LIBRARY_PATH"
exec "$DIR/lib/ld-linux-x86-64.so.2" "$DIR/baysor" "$@"
EOF
          chmod +x bundle/run_baysor.sh bundle/baysor
          # Test it works
          bundle/run_baysor.sh run --help || true
          # Tar it up
          tar czf baysor-bundle.tar.gz -C bundle .
          ls -la baysor-bundle.tar.gz

      - name: Output bundle
        run: |
          sha256sum baysor-bundle.tar.gz
          echo "===BINARY_START==="
          base64 baysor-bundle.tar.gz
          echo "===BINARY_END==="
