name: Build Baysor Binary

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates lsb-release wget
          wget https://packages.apache.org/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-$(lsb_release -cs).deb
          sudo apt-get install -y ./apache-arrow-apt-source-latest-$(lsb_release -cs).deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libeigen3-dev libomp-dev libspdlog-dev libcgal-dev \
            libarrow-dev libparquet-dev libhdf5-dev \
            nlohmann-json3-dev libtiff-dev

      - name: Build
        run: cmake -P cmake/build_and_install.cmake

      - name: Verify
        run: ./install/bin/baysor --version

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: baysor-linux-x86_64
          path: install/bin/baysor
